name: ci

on:
  push:
    branches: [main] # same-repo PRs are covered by pull_request
  pull_request:
  workflow_dispatch:

# Actions are pinned by major tag; pinning to full commit SHAs is a possible hardening.
permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    # real Postgres for the persistence tests (they skip without DATABASE_URL)
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_PASSWORD: test
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready --health-interval 5s --health-timeout 3s --health-retries 10
    env:
      DATABASE_URL: postgres://postgres:test@127.0.0.1:5432/postgres
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4 # version is read from "packageManager" in package.json
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      # protocol must be built first: other packages import its dist
      - run: pnpm --filter @agent-office/protocol build
      - run: pnpm typecheck
      - run: pnpm test
      - run: pnpm build

  e2e:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    needs: check
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm build
      - run: pnpm exec playwright install --with-deps chromium
        working-directory: e2e
      - run: pnpm test:e2e
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: playwright-report
          path: |
            e2e/playwright-report
            e2e/test-results
          if-no-files-found: ignore
          retention-days: 7

  docker:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    needs: check
    steps:
      - uses: actions/checkout@v4
      - run: docker build -t agent-office:ci .
      - name: Container smoke
        shell: bash
        run: |
          set -euo pipefail
          docker run -d --name ao --read-only --tmpfs /tmp --cap-drop ALL \
            --security-opt no-new-privileges:true \
            -e CREATE_KEY=ci-smoke-key -p 127.0.0.1:3000:3000 agent-office:ci
          trap 'docker logs ao || true; docker rm -f ao >/dev/null' EXIT
          for i in $(seq 1 30); do curl -fsS http://127.0.0.1:3000/healthz && break; sleep 1; done
          curl -fsS http://127.0.0.1:3000/healthz | grep -q '"ok":true'
          test "$(docker exec ao id -u)" != "0"
          code=$(curl -s -o /dev/null -w '%{http_code}' -X POST http://127.0.0.1:3000/rooms/anonymous \
            -H 'content-type: application/json' -d '{}')
          test "$code" = 403
          curl -fsS -X POST http://127.0.0.1:3000/rooms/anonymous \
            -H 'content-type: application/json' -H 'x-create-key: ci-smoke-key' -d '{}' | grep -q '"roomId"'
          curl -fsS http://127.0.0.1:3000/ | grep -qi '<div id="root"'
